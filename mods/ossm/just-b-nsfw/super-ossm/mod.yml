title: Super-OSSM
author: just-b-nsfw
product: ossm
description: >-
  Modular OSSM redesign by just_b with belt or Capstan drive support,
  interchangeable motor, rail, and PCB options, a twist-lock enclosure,
  and fixed or folding clamps.
mod_version: 2
compatibility:
  - OSSM modular rebuild (see upstream build guide for supported configurations)
source_url: https://github.com/just-b-nsfw/Super-OSSM
license: CERN-OHL-S-2.0
images:
  - img/super-ossm.png
tags:
  - hardware
  - modular
  - enclosure
  - clamp
  - capstan
  - external
safety:
  affects_restraint_release: false
  affects_applied_force: true
  affects_electrical: true
  notes: >-
    Changes the actuator mechanics, drive, mounting clamps, and motor/PCB
    packaging. Motor and drive choices affect applied force; electrical
    integration depends on the selected motor and PCB. Mounting clamps are
    device mounts, not body restraints. Verify secure mounting, wiring,
    clearance, emergency stop, and motion limits before use. Upstream's build
    guide is a work in progress; listed design options are not independent
    safety or compatibility validation by RAD.
