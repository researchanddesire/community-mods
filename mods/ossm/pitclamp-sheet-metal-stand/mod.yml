title: PitClamp sheet-metal stand
author: Lucy Chapar
product: ossm
description: A freestanding stand prototype with a one-piece bent-steel frame, tube braces, wraparound feet, and a rigid PitClamp Mini mount.
mod_version: 1
compatibility:
  - "PitClamp Mini Lower V1.1 STEP at OSSM-hardware b7f01bf (70 mm mounting pitch): nominal CAD fit checked; physical build untested"
  - "FreeCAD 1.1.4 with Sheet Metal 0.8.23: native model recompute and save/reopen checked on Linux"
license: CERN-OHL-S-2.0
images:
