safety:
  affects_restraint_release: false
  affects_applied_force: true
  affects_electrical: false
  notes: "Supports the actuator and carries its reaction forces. Prototype only: loaded stiffness, tipping, angle-clamp retention, fatigue and fabrication have not been validated. The slotted angle clamp is represented by a guide pin and is not a completed locking mechanism. The bare-arm hinge has nominal 180-degree travel; complete actuator folding clearance is unverified. No load or tightening-torque rating is provided."
