title: OSSM M5 Remote
author: ortlof
product: ossm
description: >-
  A wireless M5Stack-based remote control platform for the OSSM (and other
  ESP-controlled toys) — touchscreen control of speed, depth, and stroke.
mod_version: 1
compatibility:
  - OSSM (requires the OSSM-Stroke firmware, not official OSSM firmware)
  - M5Stack CoreS3 / CoreS3 SE
  - M5Stack Core2
# External / linked mod: the design files live in the author's own repo, so this
# entry is an index pointer. Because of that, license is REQUIRED here and
# DIFFERS from the repo default (CERN-OHL-S hardware / MPL software).
source_url: https://github.com/ortlof/OSSM-M5-Remote
license: CC-BY-SA-4.0
images:
  - https://raw.githubusercontent.com/ortlof/OSSM-M5-Remote/master/image/remote.png
tags:
  - remote
  - m5stack
  - external
safety:
  affects_restraint_release: false
  affects_applied_force: true
  affects_electrical: false
  notes: >-
    Commands OSSM motion (speed/depth/stroke) over the network and requires the
    third-party OSSM-Stroke firmware instead of official OSSM firmware. Treat as
    a motion controller; verify e-stop / safe limits before use.
