title: LGBT Branded Actuator Front Body
author: Lucy Chapar
product: ossm
description: >-
  A one-piece OSSM actuator front body with trans flag stripes, OSSM.TECH
  and R+D flush inlays, 17 independently colorable material regions, and
  stepped counterbore bridges for face-down printing at 0.20 mm layers.
