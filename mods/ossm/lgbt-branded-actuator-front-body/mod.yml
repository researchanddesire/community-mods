safety:
  affects_restraint_release: false
  affects_applied_force: true
  affects_electrical: false
  notes: >-
    Replaces the actuator housing and changes printed load-bearing geometry
    and fastening features. Motor control and drive ratio are unchanged.
    CAD-validated prototype; the revised flush inlays and 0.20 mm bridge
