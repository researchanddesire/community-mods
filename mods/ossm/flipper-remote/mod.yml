title: OSSM Remote for Flipper Zero
author: lucy-chapar
product: ossm
description: >-
  A Flipper Zero app that drives a stock OSSM over Bluetooth like the RADR
  remote: play and pause, speed, depth, stroke, sensation, Stroke Engine
  patterns, and a one-press emergency stop on Back. Needs a small patch to the
  Flipper firmware (BLE central role); the OSSM firmware stays stock.
mod_version: 1
compatibility:
  - OSSM with stock firmware (Bluetooth remote protocol, as used by RADR)
  - Flipper Zero on official firmware 1.5.1 plus the included BLE central patch
images:
  - img/screens.png
  - img/control.png
  - img/connect.png
  - img/stop.png
license: CERN-OHL-S-2.0
tags:
  - remote
  - flipper-zero
  - bluetooth
  - software
safety:
  affects_restraint_release: false
  affects_applied_force: true
  affects_electrical: false
  notes: >-
    Commands OSSM motion (speed, depth, stroke, patterns) over Bluetooth. Back
    is an emergency stop on the control screen: it drops queued commands and
    sends speed 0 then returns the OSSM to its menu. If the link drops, the
    stock OSSM firmware ramps speed to 0 on its own. Leaving the app sends speed
    0 and disconnects. Resume ramps speed up over about a second rather than
    jumping. Test unloaded first and keep the OSSM's own controls in reach.
