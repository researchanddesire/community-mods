title: OSSM One-Piece Front Actuator Body
author: Lucy Chapar
product: ossm
description: >-
  A curved, one-piece OSSM front housing that removes one printed part,
  two M3 bolts, and their nuts, with flush branding and separately
  colorable R+D lettering and border.
mod_version: 1
compatibility:
  - OSSM Body - Middle and RD branded Body - Cover reference geometry
