name: Project catalog checks

on:
  pull_request:
    paths:
      - 'mods/**'
      - '.github/workflows/scripts/**'
      - '.github/workflows/mod-lint.yml'
      - '.github/workflows/gallery.yml'
      - 'LICENSE'
      - 'LICENSES/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'AGENTS.md'
      - '.cursor/rules/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
  push:
    branches: [main]
    paths:
      - 'mods/**'
      - '.github/workflows/scripts/**'
      - '.github/workflows/mod-lint.yml'
      - '.github/workflows/gallery.yml'
      - 'LICENSE'
      - 'LICENSES/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'AGENTS.md'
      - '.cursor/rules/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
  workflow_dispatch:

jobs:
  # Retain the legacy job id because main-branch protection requires the
  # `mod-lint` status context. The workflow and step names remain project-first.
  mod-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install pyyaml jsonschema markdown nh3 'packaging>=24.2'
      - name: Validate projects against the catalog schema
        run: python .github/workflows/scripts/mod_lint.py
      - name: Run catalog regression tests
        run: python -m unittest discover -s .github/workflows/scripts -p 'test_*.py'
      - name: Build Project Hub gallery
        run: python .github/workflows/scripts/build_gallery.py

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require Signed-off-by on every PR commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list "$BASE_SHA".."$HEAD_SHA"); do
            if ! git log -1 --format='%B' "$sha" | grep -qi '^Signed-off-by: .\+ <.\+@.\+>'; then
              echo "::error::commit $sha is missing a DCO Signed-off-by line"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign your commits with 'git commit -s'. See CONTRIBUTING.md."
            exit 1
          fi
          echo "All commits are signed off."
