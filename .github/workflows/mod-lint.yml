name: Project catalog checks

on:
  pull_request:
    paths:
      - 'mods/**'
      - 'examples/**'
      - '.github/workflows/scripts/**'
      - '.github/workflows/mod-lint.yml'
      - '.github/workflows/gallery.yml'
      - 'LICENSE'
      - 'LICENSES/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'AGENTS.md'
      - '.cursor/rules/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
  push:
    branches: [main]
    paths:
      - 'mods/**'
      - 'examples/**'
      - '.github/workflows/scripts/**'
      - '.github/workflows/mod-lint.yml'
      - '.github/workflows/gallery.yml'
      - 'LICENSE'
      - 'LICENSES/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'AGENTS.md'
      - '.cursor/rules/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
  workflow_dispatch:

jobs:
  # Keep this stable job id because main-branch protection requires the
  # `mod-lint` status context. The workflow and step names are project-first.
  mod-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install pyyaml jsonschema markdown nh3
      - name: Validate projects against the catalog schema
        run: python .github/workflows/scripts/mod_lint.py
      - name: Run catalog regression tests
        run: python -m unittest discover -s .github/workflows/scripts -p 'test_*.py'
      - name: Build Project Hub gallery
        run: python .github/workflows/scripts/build_gallery.py
