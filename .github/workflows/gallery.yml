name: Build Mod Hub gallery

on:
  push:
    branches: [main]
    paths:
      - 'mods/**'
      - '.github/workflows/scripts/build_gallery.py'
      - '.github/workflows/gallery.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install deps
        run: pip install pyyaml markdown nh3
      - name: Build gallery
        run: python .github/workflows/scripts/build_gallery.py
      - name: Add CNAME
        run: echo 'mods.researchanddesire.com' > site/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
